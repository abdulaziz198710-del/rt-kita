name: CI

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check semua file JS
        run: |
          for f in server.js src/*.js src/routes/*.js public/*.js test/*.js tools/*.js; do
            node --check "$f"
          done
      - name: Jalankan test end-to-end
        run: npm test
